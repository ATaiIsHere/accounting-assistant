schema: spec-driven

context: |
  本專案使用 OpenSpec 進行規格驅動開發。
  所有 proposal、design、tasks、spec 文件一律使用台灣繁體中文撰寫。
  程式碼、檔名、函式名稱、類別名稱、API 欄位名稱維持英文。
  請使用台灣常用詞彙，例如：欄位、驗證、設定、佈署、資料夾、需求、規格。
  除非我明確要求，請不要使用簡體中文。
  進行功能規劃前，先閱讀現有 specs 與 changes，避免與既有規格衝突。
  優先做最小可行變更，避免無關重構。

rules:
  proposal:
    - 使用繁體中文說明變更背景、目標、影響範圍與風險。
    - 若有替代方案，簡短列出取捨。
  specs:
    - 使用繁體中文撰寫需求與驗收情境。
    - 每個 Requirement 至少提供一個 `#### Scenario:`。
    - 內容需具體、可驗證，避免空泛敘述。
  design:
    - 使用繁體中文說明技術設計、資料流、相依性與風險。
    - 若不需要 design，應清楚說明原因。
  tasks:
    - 使用繁體中文拆解工作項目。
    - 任務應小而明確，可直接執行與驗證。