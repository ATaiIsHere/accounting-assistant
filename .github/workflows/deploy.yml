name: Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-assistant-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Run Worker tests
        run: npm test

      - name: Lint dashboard
        run: npm --prefix dashboard run lint

      - name: Build dashboard
        run: npm --prefix dashboard run build

  infra-plan:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_ALLOWED_EMAILS: ${{ secrets.CLOUDFLARE_ACCESS_ALLOWED_EMAILS }}
      CLOUDFLARE_ACCESS_ALLOWED_EMAIL_DOMAINS: ${{ secrets.CLOUDFLARE_ACCESS_ALLOWED_EMAIL_DOMAINS }}
      DASHBOARD_DOMAIN: ${{ vars.DASHBOARD_DOMAIN }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      PAGES_PRODUCTION_BRANCH: ${{ vars.PAGES_PRODUCTION_BRANCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix dashboard

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Plan infrastructure
        run: npm run infra:plan

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: infra-plan
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_ALLOWED_EMAILS: ${{ secrets.CLOUDFLARE_ACCESS_ALLOWED_EMAILS }}
      CLOUDFLARE_ACCESS_ALLOWED_EMAIL_DOMAINS: ${{ secrets.CLOUDFLARE_ACCESS_ALLOWED_EMAIL_DOMAINS }}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ secrets.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALLOWED_USER_ID: ${{ secrets.ALLOWED_USER_ID }}
      DASHBOARD_PROXY_SECRET: ${{ secrets.DASHBOARD_PROXY_SECRET }}
      DASHBOARD_DOMAIN: ${{ vars.DASHBOARD_DOMAIN }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      PAGES_PRODUCTION_BRANCH: ${{ vars.PAGES_PRODUCTION_BRANCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix dashboard

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run shared deploy workflow
        run: npm run deploy:ci
